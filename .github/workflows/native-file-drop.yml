name: Barrier Share desktop
on:
  pull_request:
    paths: ['src/**', 'tools/native-file-drop/**', 'CMakeLists.txt', '.github/workflows/native-file-drop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-drop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          -DBARRIER_USE_SYSTEM_OPENSSL=ON -DBARRIER_NATIVE_DROP_TESTS=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_OSX_SYSROOT="$(xcrun --show-sdk-path)"
      - name: Build and test
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
      - name: LAN discovery, consent and automatic reconnection
        run: python3 tools/native-file-drop/link-network-test.py build/bin
      - name: Package and test native Mac app
        env:
          BARRIER_CODESIGN_IDENTITY: '-' # Disposable CI test artifact, not a stable signed release.
        run: sh tools/native-file-drop/package-macos.sh build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-desktop-test
          path: build/gui-test/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-cross-drop-macos-arm64
          path: build/barrier-cross-drop-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: native-drop-openssl-static-win2022-v1
      - name: OpenSSL
        run: vcpkg install openssl:x64-windows-static
      - uses: actions/cache/save@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: native-drop-openssl-static-win2022-v1
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          -DBARRIER_USE_SYSTEM_OPENSSL=ON -DBARRIER_NATIVE_DROP_TESTS=ON
      - name: Build desktop launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin/Release | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo "/win32icon:$PWD\tools\native-file-drop\icons\BarrierShare.ico" /target:winexe /platform:x64 /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Xml.Linq.dll "/win32manifest:$PWD\tools\native-file-drop\utf8.manifest" "/out:$PWD\build\bin\Release\BarrierShare.exe" "$PWD\tools\native-file-drop\BarrierShare.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Protocol and actual OLE tests
        run: ctest --test-dir build -C Release --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: explorer-failure-screens
          path: build/tools/native-file-drop/explorer-*.bmp
          if-no-files-found: ignore
          retention-days: 7
      - name: Windows client TLS-to-native-drop integration
        run: python tools/native-file-drop/windows-cli-network-test.py build/bin/Release
      - name: Windows server Explorer-to-TLS integration
        run: python tools/native-file-drop/windows-server-network-test.py build/bin/Release
      - name: Bidirectional file clipboard and actual Explorer paste
        run: python tools/native-file-drop/windows-clipboard-network-test.py build/bin/Release
      - name: LAN discovery, consent and automatic reconnection
        run: python tools/native-file-drop/link-network-test.py build/bin/Release
      - name: Desktop settings and pairing migration
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/gui-test | Out-Null
          $test = Start-Process build/bin/Release/BarrierShare.exe -ArgumentList '--self-test', "$PWD/build/gui-test" -PassThru
          if (-not $test.WaitForExit(60000)) { $test.Kill(); throw 'Desktop self-test timed out' }
          if ($test.ExitCode -ne 0) { Get-Content build/gui-test/FAIL.txt; throw 'Desktop self-test failed' }
          Get-Content build/gui-test/PASS.txt
      - name: Normal desktop startup and live discovery in both roles
        shell: pwsh
        run: |
          $test = Start-Process build/bin/Release/BarrierShare.exe -ArgumentList '--startup-test', "$PWD/build/gui-test" -PassThru
          if (-not $test.WaitForExit(45000)) { $test.Kill(); throw 'Production startup test timed out' }
          if ($test.ExitCode -ne 0 -or -not (Test-Path build/gui-test/STARTUP-PASS.txt)) {
            Get-Content build/gui-test/STARTUP-FAIL.txt -ErrorAction SilentlyContinue
            throw 'Production startup test failed'
          }
          Get-Content build/gui-test/STARTUP-PASS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-gui-test
          path: |
            build/gui-test/*.png
            build/gui-test/*.txt
            explorer-*.bmp
          if-no-files-found: ignore
          retention-days: 7
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/package | Out-Null
          Copy-Item build/bin/Release/barrierc.exe, build/bin/Release/barriers.exe, build/bin/Release/barrier-pair.exe, build/bin/Release/barrier-link.exe, build/bin/Release/BarrierShare.exe build/package/
          Copy-Item tools/native-file-drop/GUI-README.txt build/package/
          Copy-Item LICENSE build/package/
          Copy-Item -Recurse tools/native-file-drop/licenses build/package/
          Copy-Item C:/vcpkg/installed/x64-windows-static/share/openssl/copyright build/package/licenses/OpenSSL.txt
          git rev-parse HEAD | Out-File build/package/COMMIT.txt
          Compress-Archive -Path build/package/* -DestinationPath build/barrier-cross-drop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-cross-drop-windows-x64
          path: build/barrier-cross-drop-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

name: Cross-machine native file drop
on:
  pull_request:
    paths: ['src/**', 'tools/native-file-drop/**', 'CMakeLists.txt', '.github/workflows/native-file-drop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-drop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          -DBARRIER_USE_SYSTEM_OPENSSL=ON -DBARRIER_NATIVE_DROP_TESTS=ON
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_OSX_SYSROOT="$(xcrun --show-sdk-path)"
      - name: Build and test
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
          build/bin/barriers --version
      - name: Package
        run: sh tools/native-file-drop/package-macos.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-cross-drop-macos-arm64
          path: build/barrier-cross-drop-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: native-drop-openssl-static-win2022-v1
      - name: OpenSSL
        run: vcpkg install openssl:x64-windows-static
      - uses: actions/cache/save@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: native-drop-openssl-static-win2022-v1
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          -DBARRIER_USE_SYSTEM_OPENSSL=ON -DBARRIER_NATIVE_DROP_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Protocol and actual OLE tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Windows client TLS-to-native-drop integration
        run: python tools/native-file-drop/windows-cli-network-test.py build/bin/Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/package | Out-Null
          Copy-Item build/bin/Release/barrierc.exe, build/bin/Release/barrier-pair.exe build/package/
          Copy-Item tools/native-file-drop/Start-Windows.cmd, tools/native-file-drop/README.md, LICENSE build/package/
          git rev-parse HEAD | Out-File build/package/COMMIT.txt
          Compress-Archive -Path build/package/* -DestinationPath build/barrier-cross-drop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: barrier-cross-drop-windows-x64
          path: build/barrier-cross-drop-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

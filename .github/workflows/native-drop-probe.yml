name: Native file drop preview
on:
  push:
    branches: [prototype/native-file-drop]
    paths: ['tools/native-drop-probe/**', '.github/workflows/native-drop-probe.yml']
  pull_request:
    paths: ['tools/native-drop-probe/**', '.github/workflows/native-drop-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-arm64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test Apple Silicon preview
        run: sh tools/native-drop-probe/build-macos.sh build/native-drop
      - name: Package
        run: |
          cp tools/native-drop-probe/README.md tools/native-drop-probe/verify-drop.py LICENSE build/native-drop/
          ditto -c -k --sequesterRsrc --keepParent build/native-drop build/native-drop-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-drop-macos-arm64
          path: build/native-drop-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S tools/native-drop-probe -B build/native-drop -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build/native-drop --config Release
      - name: Native data object tests
        run: ctest --test-dir build/native-drop -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/package | Out-Null
          Copy-Item build/native-drop/Release/native-drop-probe.exe build/package/
          Copy-Item tools/native-drop-probe/README.md, tools/native-drop-probe/verify-drop.py, LICENSE build/package/
          Compress-Archive -Path build/package/* -DestinationPath build/native-drop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-drop-windows-x64
          path: build/native-drop-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
